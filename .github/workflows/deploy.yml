# Customized workflow for building and deploying a VitePress site to GitHub Pages

name: Deploy VitePress site to Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Separate group per ref so PR build checks never queue ahead of a production
  # deploy (they previously shared one serialized `pages` group). PRs cancel
  # their own superseded runs; pushes to main never cancel an in-progress deploy.
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Check Bun version
        run: bun --version

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build VitePress site
        run: bun run docs:build
        env:
          # Algolia search config is baked into the HTML at build time
          # (docs/.vitepress/config.ts reads these from process.env).
          APP_ID: ${{ secrets.APP_ID }}
          API_KEY: ${{ secrets.API_KEY }}
          INDEX_NAME: ${{ secrets.INDEX_NAME }}
          ASSISTANT_ID: ${{ secrets.ASSISTANT_ID }}
          ASSISTANT_INDEX_NAME: ${{ secrets.ASSISTANT_INDEX_NAME }}

      - name: Check internal links and redirect bookmarks
        run: python3 scripts/check-guide-links.py

      - name: Test navigation, translated articles, related guides, metadata, page dates, llms dates, URL fallbacks, IndexNow URLs and guide measurement
        run: bun test scripts/product-families.test.ts scripts/articles.test.ts scripts/translation-sync.test.ts scripts/page-dates.test.ts scripts/page-head.test.ts scripts/indexnow-urls.test.ts scripts/guide-analytics.test.ts scripts/sale-banner.test.ts scripts/related-guides.test.ts scripts/llms-files.test.ts scripts/url-fallbacks.test.ts

      - name: List build directory contents
        run: ls -la docs/.vitepress/dist

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  indexnow:
    # Ping IndexNow with the pages changed in this push so Bing-family engines
    # (Bing/Copilot/ChatGPT search, Yandex, etc.) recrawl them quickly.
    # Google does not use IndexNow. The key is public by design; it must match
    # docs/public/<key>.txt served at the site root.
    if: github.event_name == 'push'
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      actions: read # list earlier deploy runs
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Find the last fully deployed commit
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          # Diff from the last push whose deploy and ping both succeeded, not
          # from github.event.before. When a Pages deploy fails (it timed out
          # three times on 2026-11-06), that run's ping is skipped, and the next
          # push used to submit only its own changes, so the failed push's pages
          # were never sent. Falls back to the push's before SHA.
          last=$(gh api "repos/$REPO/actions/workflows/deploy.yml/runs?branch=main&event=push&status=success&per_page=30" \
            --jq "[.workflow_runs[] | select(.id != $RUN_ID) | .head_sha][0] // empty" || true)
          echo "Last fully deployed commit: ${last:-none found, using $EVENT_BEFORE}"
          echo "sha=${last:-$EVENT_BEFORE}" >> "$GITHUB_OUTPUT"

      - name: Submit changed URLs to IndexNow
        env:
          INDEXNOW_KEY: 4c037b783fbf7d87c71f574bef22136f
          HOST: airpodsreplicas.com
          BEFORE: ${{ steps.base.outputs.sha }}
        run: |
          # Canonical URLs of pages whose rendered content changed since the
          # last fully deployed commit: generation files resolve to their family
          # page, pages that include a changed file are added, deleted pages are
          # submitted so engines drop the 404, and changed llms files are
          # submitted by URL. An unknown base SHA (force push, new branch) falls
          # back to the head commit's changes. No dependencies needed.
          urls=$(bun scripts/indexnow-urls.ts "$BEFORE" "$GITHUB_SHA")
          if [ -z "$urls" ]; then
            echo "No doc pages changed; skipping IndexNow ping."
            exit 0
          fi
          echo "Submitting $(printf '%s\n' "$urls" | wc -l | tr -d ' ') URL(s) to IndexNow:"
          printf '%s\n' "$urls"
          payload=$(printf '%s\n' "$urls" | jq -R . | jq -s --arg host "$HOST" --arg key "$INDEXNOW_KEY" \
            '{host: $host, key: $key, keyLocation: "https://\($host)/\($key).txt", urlList: .}')
          status=$(curl -sS -o /tmp/indexnow-response.txt -w '%{http_code}' \
            -X POST 'https://api.indexnow.org/indexnow' \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "$payload")
          echo "IndexNow response: HTTP $status"
          cat /tmp/indexnow-response.txt || true
          # 200 = OK, 202 = accepted (key validation pending)
          if [ "$status" != "200" ] && [ "$status" != "202" ]; then
            exit 1
          fi
